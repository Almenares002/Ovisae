<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OVIS Portal de clientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Portal de clientes de OVIS A&E.">
<meta name="theme-color" content="#2B2D30">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OVIS Portal">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="OVIS Portal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #2B2D30; overflow: hidden; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #e8e8e8; }
  #app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; display: block; background: #2B2D30; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #2B2D30; transition: opacity .3s; z-index: 2; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; }
  #splash p { margin: 0; color: #c9c9c9; letter-spacing: .02em; }
  .bar { width: 120px; height: 3px; border-radius: 3px; background: #44474b; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #ABCA41; animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #splash.gone { opacity: 0; pointer-events: none; }
  #off { display: none; color: #ABCA41; text-align: center; padding: 0 24px; }
  #splash.offline #off { display: block; }
  #splash.offline .bar, #splash.offline #msg { display: none; }
  #off button { margin-top: 12px; background: #ABCA41; color: #2B2D30; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <img src="icons/icon-192.png" alt="OVIS">
  <p id="msg">Cargando OVIS Portal…</p>
  <div class="bar"><i></i></div>
  <div id="off">Sin conexión a internet.<br><button type="button" onclick="location.reload()">Reintentar</button></div>
</div>
<!-- credentialless: the system loads without the phone's Google accounts (like an incognito tab), which avoids Google's multi-account error page. -->
<iframe id="app" title="OVIS Portal de clientes" credentialless allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen"></iframe>
<script>
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbzHxsiLfVioVeDpYow75D11b4i9-aWWs5YVrgBjn7CchlNxnCm0R69sjI03_c2PuDIu/exec?portal=1&pwa=1';
  var KEYS = ["ovis_portal_token", "ovis_portal_email", "ovis_portal_lang"];
  var FWD = ['lang'];
  var q = new URLSearchParams(location.search), src = BASE;
  FWD.forEach(function (k) { if (q.get(k)) src += '&' + k + '=' + encodeURIComponent(q.get(k)); });
  var splash = document.getElementById('splash'), frame = document.getElementById('app');
  if (!navigator.onLine) splash.className = 'offline';
  frame.addEventListener('load', function () { setTimeout(function () { splash.className = 'gone'; }, 600); });
  frame.src = src;
  window.addEventListener('online', function () { if (splash.className === 'offline') location.reload(); });

  // Session bridge: the system's own page (served from *.googleusercontent.com) asks for / saves its login here.
  var OK = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!OK.test(ev.origin) || !d || typeof d !== 'object' || !ev.source) return;
    if (d.ovis === 'get') {
      var vals = {};
      KEYS.forEach(function (k) { var v = get(k); if (v) vals[k] = v; });
      ev.source.postMessage({ ovis: 'vals', vals: vals }, ev.origin);
    } else if (d.ovis === 'set' && KEYS.indexOf(d.k) >= 0) {
      try { if (d.v === null || d.v === undefined) localStorage.removeItem(d.k); else localStorage.setItem(d.k, String(d.v)); } catch (e) {}
    }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
})();
</script>
</body>
</html>
